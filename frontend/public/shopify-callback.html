<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Connecting Shopify Store...</title>
    <style>
        body {
            background-color: #0d0e12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #96BF48;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 8px 0;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2 id="status-title">Connecting Shopify Store...</h2>
        <p id="status-desc">Please wait while we complete the connection.</p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const shopifyStatus = params.get('shopify');
        const error = params.get('error');
        const detail = params.get('detail');

        const syncChannel = new BroadcastChannel('mantram_sync');

        let msg = null;
        if (shopifyStatus === 'connected') {
            msg = { type: 'SHOPIFY_CONNECTED' };
            document.getElementById('status-title').innerText = 'Connected!';
            document.getElementById('status-desc').innerText = 'Your Shopify store has been successfully connected. Closing window...';
        } else {
            const errDetail = error || 'shopify_auth_failed';
            msg = { type: 'SHOPIFY_FAILED', detail: detail || errDetail };
            document.getElementById('status-title').innerText = 'Connection Failed';
            document.getElementById('status-desc').innerText = detail || errDetail || 'OAuth connection failed. Closing window...';
            document.querySelector('.spinner').style.borderLeftColor = '#ef4444';
        }

        if (msg) {
            // 1. Post to opener if available
            if (window.opener) {
                try {
                    window.opener.postMessage(msg, window.location.origin);
                } catch (e) {
                    console.error('postMessage error:', e);
                }
            }

            // 2. Broadcast via BroadcastChannel (in case window.opener is null/blocked)
            try {
                syncChannel.postMessage(msg);
            } catch (e) {
                console.error('BroadcastChannel error:', e);
            }
        }

        syncChannel.close();

        // 3. Close the popup window
        setTimeout(() => {
            window.close();
        }, 800);
    </script>
</body>
</html>
