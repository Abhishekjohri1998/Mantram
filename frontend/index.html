  {

    "@type": "FAQPage",

    "mainEntity": [
      {
        "@type": "Question",
        "name": "What is Mantram AI?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Mantram AI is an agentic AI marketing operating system with 14 specialised studios. It captures your Brand DNA once — voice, visuals, audience, competitors — then runs an agent fleet (research, ideation, content, creative, video, social, performance ads, SEO + AEO, retention) that all share the same brand brain. Built for D2C brands and marketing agencies in India and globally. In early access as of May 2026."
        }
      },
      {
        "@type": "Question",
        "name": "In 2026 every tool has AI. What makes Mantram different?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Three things. First, Brand DNA — every studio reads from one structured profile of your brand, so output sounds like you, not like generic AI slop. Second, model-agnostic agent fleet — we route across Claude, Gemini, GPT, Veo, Sora, NanoBanana, Flux, HappyHorse and more, picking the best model per task. We are loyal to none. Third, Indian-first — Hindi/Marathi/Hinglish via Sarvam-Bhasha + Claude/Gemini routing, DLT-compliant SMS, INR pricing, DPDP-compliant data handling."
        }
      },
      {
        "@type": "Question",
        "name": "Won't my AI-generated content get penalised as AI slop?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Only if it sounds like generic AI. Google's Helpful Content guidance and AI search engines (ChatGPT Search, AI Overviews, Perplexity) penalise low-effort AI output that lacks point of view. Mantram's Brand DNA + Critic-node pipelines force every piece to be brand-faithful, opinionated and source-cited — the opposite of slop. SEO Studio also rewrites output for AEO so AI search engines actually quote you."
        }
      },
      {
        "@type": "Question",
        "name": "How do I get cited in ChatGPT Search, AI Overviews and Perplexity?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "That is what AEO (Answer Engine Optimization) is for, and SEO Studio does it natively. We rewrite your content with clear claims, source attribution, structured data, FAQPage + HowTo + Speakable schema, and citation-worthy phrasing. Then we track your citation share across ChatGPT Search, Google AI Overviews, Google AI Mode, Microsoft Copilot Search, Perplexity, Claude with web, and Apple Intelligence — so you can see which engines quote you and on which queries."
        }
      },
      {
        "@type": "Question",
        "name": "What does Brand DNA mean in Mantram AI?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Brand DNA is Mantram's onboarding artefact: a structured profile of your brand built from a website scan, social audit, competitor research and review-sentiment analysis in about 90 seconds. It captures voice (witty, formal, warm), visual identity (palette, typography), platform-specific tone, content rules and a knowledge bank. Every studio reads from this single source so output stays on-brand without re-prompting."
        }
      },
      {
        "@type": "Question",
        "name": "Which AI models does Mantram AI use?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Mantram is model-agnostic and routes per task. Reasoning: Claude Sonnet 4.6, Gemini 3 Pro, Gemini 2.5 Pro, GPT-4o. Image: GPT Image 2, NanoBanana 2, NanoBanana Pro, Flux Kontext Max/Pro. Video: Google Veo 3.1, OpenAI Sora 2, Seedance 2.0 Pro, Kling 3.0, HappyHorse 1.0, Hailuo MiniMax, Wan 2.1. Avatars: HeyGen. Indian-language: Sarvam AI / Bhasha models. We pick the best one for each job — quality, latency and cost-optimised — and you are never locked to one vendor."
        }
      },
      {
        "@type": "Question",
        "name": "Is Mantram AI free?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Not currently. Mantram is in early access through May 2026 — request access via the waitlist. Pricing is credit-pack based starting from ₹149 (Micro, 20 credits) up to ₹17,999 (Enterprise, 5,000 + 2,000 bonus credits). No subscription, no monthly fee. Credits stay valid 6–12 months. UPI auto-pay supported for Indian customers."
        }
      },
      {
        "@type": "Question",
        "name": "Who is Fidato?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Fidato (Italian for trusted) is Mantram's always-on AI branding expert — a conversational agent that knows your Brand DNA cold and answers strategy, copy, campaign and brand-health questions in your language. Available across the platform via the floating chat panel. Powered by Claude Sonnet 4.6 reasoning + your full brand context."
        }
      },
      {
        "@type": "Question",
        "name": "What does agentic mean in Mantram AI in 2026 terms?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Agentic means an agent fleet, not single AI calls. Creative Studio runs Art Director → Prompt Engineer → Style Critic → Generator as separate agents. Master Orchestrator routes user intent across 14 studios. The MCP server exposes live tools (web_search, scrape_competitor, fetch_trending, fetch_seo_audit) that agents call during reasoning. By 2026, single-prompt AI is table stakes — agentic orchestration with shared brand context is the difference."
        }
      },
      {
        "@type": "Question",
        "name": "How does Mantram comply with India's DPDP Act?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Mantram is built DPDP-compliant from day one — explicit consent flows, purpose-bound processing, user-initiated data deletion (mantram.ai/data-deletion), data residency options for India, and no third-party model training on your data. Your brand content stays yours; we don't use it to train shared models. Same applies for GDPR (EU) and California CCPA — global compliance baked in."
        }
      },
      {
        "@type": "Question",
        "name": "Does Mantram AI support Indian languages?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes — Hindi, Marathi, Hinglish, English, code-switched output, plus expanding regional support via Sarvam AI / Bhasha-1 models. The Smart Language Router auto-detects your brand's preferred language from Brand DNA and picks the optimal model per task. SMS deliveries via Twilio are TRAI DLT-registered."
        }
      },
      {
        "@type": "Question",
        "name": "What does Mantram AI integrate with?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Commerce: Shopify, Etsy, WooCommerce. Social and ads: Meta (Facebook + Instagram), LinkedIn, X, Google Ads, Meta Ads, Google Analytics 4. SEO + AEO data: DataForSEO, Moz. Comms: Twilio (DLT-compliant SMS), Firebase (push). All integrations are Meta-compliance-aware with anti-mimicry delays and signed webhooks."
        }
      }
    ]
  }
