        "@type": "Question",

        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Mantram AI's Video Studio supports three AI video models — Seedance 2.0 (by ByteDance), Kling, and Veo 2 (by Google). You can generate videos from text prompts, convert images to video, extend existing videos, and use reference images for style guidance. The studio supports resolutions up to 4K with multiple aspect ratios."
        }
      },
      {
        "@type": "Question",
        "name": "Can Mantram AI publish directly to social media?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Mantram AI integrates with Meta (Facebook and Instagram), YouTube, and other platforms for direct publishing. You can create content in Content Studio, design visuals in Creative Studio, schedule posts via the Smart Calendar, and even automate DM responses using the Conversation Studio — all without leaving the platform."
        }
      },

        "@type": "Question",
        "name": "Is Mantram AI suitable for Indian D2C brands?",

          "@type": "Answer",
          "text": "Absolutely. Mantram AI is purpose-built for Indian D2C brands and agencies. It includes Shopify integration for e-commerce intelligence, festival-aware Smart Calendar (Diwali, Holi, Navratri), multi-language support for Indian languages (Hindi, Tamil, Telugu, Bengali, Marathi, and more via Sarvam AI), and INR-based pricing."

        }
      }
