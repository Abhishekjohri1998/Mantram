  <script type="application/ld+json">

    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Mantram AI",
    "url": "https://mantram.ai/",
    "logo": "https://mantram.ai/mantram-logo.png",

    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "customer service",
      "email": "support@mantram.ai",
      "url": "https://mantram.ai/"
    },
    "knowsAbout": [
      "Artificial Intelligence",
      "Digital Marketing",
      "Content Marketing",
      "Social Media Marketing",
      "SEO",
      "Performance Marketing",
      "E-Commerce Analytics",
      "AI Content Generation",
      "Brand Intelligence"
    ]
  }

  <!-- JSON-LD: WebSite + Speakable -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Mantram AI",
    "url": "https://mantram.ai/",
    "description": "AI-Powered Marketing Operating System — 10 Studios, One Platform",
    "publisher": {
      "@type": "Organization",
      "name": "Mantram AI"
    },
    "speakable": {
      "@type": "SpeakableSpecification",
      "cssSelector": ["h1", "h2", ".text-lg"]
    }
  }
  </script>

  <!-- JSON-LD: SoftwareApplication -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Mantram AI",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "description": "AI-powered marketing platform with 10 studios: Content, Creative, Video, Performance Marketing, SEO, D2C, Conversations, Brainstorm, Smart Calendar, and Analytics.",
    "url": "https://mantram.ai/",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "INR",
      "description": "Free tier available. Premium plans with expanded AI credits."
    },
    "featureList": [
      "AI Content Generation",
      "AI Creative Design",
      "Multi-Model Video Production",
      "AI Ad Campaign Strategy",
      "AI SEO Audits & Keyword Research",
      "Shopify D2C Intelligence",
      "Social Media Auto-Responder",

      "Smart Marketing Calendar",
      "Traffic & Audience Analytics",
      "Brand DNA Extraction",
      "Multi-Platform Publishing"
    ]
  }
  </script>

  <!-- JSON-LD: BreadcrumbList -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "Home",
        "item": "https://mantram.ai/"
      }
    ]
  }
  </script>

  <!-- JSON-LD: FAQPage -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What is Mantram AI?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Mantram AI is an AI-powered marketing operating system with 10 specialized studios — Content, Creative, Video, Performance Marketing, SEO, D2C Analytics, Conversations, Brainstorm, Smart Calendar, and Analytics. It enables brands and agencies to generate brand-consistent content, design creatives, produce videos, and publish across platforms — all from one platform."
        }
      },
      {
        "@type": "Question",
        "name": "What AI models does Mantram AI use?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Mantram AI uses a multi-model architecture, routing each task to the optimal AI model. This includes Google Gemini, Anthropic Claude, OpenAI GPT-4o, xAI Grok, Google Imagen for images, and Seedance, Kling, and Veo for video generation. The platform automatically selects the best model for each request."
        }
      },
      {
        "@type": "Question",
        "name": "What is Brand DNA in Mantram AI?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Brand DNA is Mantram AI's proprietary feature that scans any website in 60 seconds to extract your brand identity — logo, color palette, typography, voice, tone, and visual style. This Brand DNA is then used across all studios to ensure every piece of content generated is brand-consistent."
        }
      },
      {
        "@type": "Question",
        "name": "Can Mantram AI publish directly to social media?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Mantram AI integrates with Meta (Facebook and Instagram), YouTube, and other platforms for direct publishing. You can create content, schedule posts via the Smart Calendar, and even automate DM responses using the Conversation Studio."
        }
      },
      {
        "@type": "Question",
        "name": "Is Mantram AI free to use?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Mantram AI offers a free tier with limited AI credits. Premium plans (Professional and Enterprise) provide expanded credit allocations, team collaboration, advanced features, and priority support. Early access users receive exclusive benefits."
        }
      },
      {
        "@type": "Question",
        "name": "How does Mantram AI handle data privacy and security?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Mantram AI uses SSL/TLS encryption, encrypted credential storage, and role-based access controls. We comply with Google API Limited Use requirements and Shopify Partner Terms. We never sell user data. Users can disconnect integrations and request full data deletion at any time."
        }
      }
    ]
  }
  </script>
