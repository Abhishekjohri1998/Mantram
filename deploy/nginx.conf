# Mantram AI — Nginx Config
# Copy to /etc/nginx/sites-available/mantram on EC2
# Then: sudo ln -sf /etc/nginx/sites-available/mantram /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl restart nginx

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 80;
    server_name mantram.ai www.mantram.ai;
    # After SSL setup, Certbot will auto-add redirect to 443

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Frontend — Vite build (SPA)
    location / {
        root /var/www/mantram/current/dist;
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # API proxy → Node.js backend
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        # Global CORS headers (fallback for gateway errors)
        add_header 'Access-Control-Allow-Origin' 'https://mantram.ai' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://mantram.ai' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for AI operations (can be slow)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;

        # Custom JSON error pages for gateway errors
        error_page 502 = @bad_gateway_json;
        error_page 504 = @timeout_json;

        # Large body for image uploads
        client_max_body_size 50m;
    }

    # Named location for 502 Bad Gateway JSON response with CORS headers
    location @bad_gateway_json {
        default_type application/json;
        add_header 'Access-Control-Allow-Origin' 'https://mantram.ai' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        return 502 '{"success":false,"error":"Server Restarting","message":"The server is restarting after a deployment. Please try again in a few seconds."}';
    }

    # Named location for timeout JSON response with CORS headers
    location @timeout_json {
        default_type application/json;
        add_header 'Access-Control-Allow-Origin' 'https://mantram.ai' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        return 504 '{"success":false,"error":"Gateway Timeout","message":"The request took too long to process (over 5 minutes). The server is still working in the background, please try refreshing the page in a moment."}';
    }

    # Block sensitive files
    location ~ /\. {
        deny all;
    }
    location ~ \.env$ {
        deny all;
    }
}
