name: 🔙 Manual Rollback

on:
  workflow_dispatch:

jobs:
  rollback:
    name: 🔙 Revert Backend to Previous Release
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.0.0
        with:
          aws-access-key-id: ${{ secrets.MEDIA_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MEDIA_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 🔍 Get Runner IP
        id: ip
        run: echo "ipv4=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT

      - name: 🔓 Whitelist Runner IP (Port 22)
        run: |
          RUNNER_IP="${{ steps.ip.outputs.ipv4 }}"
          SG_ID="${{ secrets.AWS_SECURITY_GROUP_ID }}"

          if [ -z "$SG_ID" ]; then
            echo "❌ ERROR: AWS_SECURITY_GROUP_ID secret is missing!"
            exit 1
          fi

          if [ -z "$RUNNER_IP" ]; then
            echo "❌ ERROR: Could not determine Runner IP!"
            exit 1
          fi

          echo "🌐 Runner IP: $RUNNER_IP"
          echo "🛡️ SG ID: $SG_ID"

          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP/32" || echo "✅ Rule may already exist, continuing..."

          echo "⏳ Waiting 10s for SG rule to propagate..."
          sleep 10

          echo "🔍 Verifying SSH connectivity..."
          for i in {1..5}; do
            if nc -zv ${{ secrets.EC2_HOST }} 22 -w 5 2>/dev/null; then
              echo "✅ Port 22 is reachable"
              break
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done

      - name: ⚙️ Rollback via SSH
        uses: appleboy/ssh-action@v1.2.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            BASE_DIR=/home/ec2-user/deployments
            CURRENT_LINK=/home/ec2-user/Mantram

            PREVIOUS_RELEASE=$(ls -1t $BASE_DIR | sed -n '2p')

            if [ -z "$PREVIOUS_RELEASE" ]; then
              echo "❌ No previous release found to rollback to!"
              exit 1
            fi

            echo "🔙 Rolling back to: $PREVIOUS_RELEASE"
            ln -sfn $BASE_DIR/$PREVIOUS_RELEASE $CURRENT_LINK

            cd $CURRENT_LINK
            pm2 delete mantram-server || true
            NODE_OPTIONS="--max-old-space-size=1536" pm2 start backend/deploy/ecosystem.config.cjs --update-env
            pm2 save

            echo "✅ Rollback successful. Now running: $PREVIOUS_RELEASE"
            curl -sf http://localhost:3001/api/health || echo "⚠️ Health check missed, check manually."

      - name: 🔒 Revoke Runner IP (Cleanup)
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32 || echo "Rule already removed or not found"
