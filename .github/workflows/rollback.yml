name: 🔙 Manual Rollback

on:
  workflow_dispatch:

jobs:
  rollback:
    name: 🔙 Revert Backend to Previous Release
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Rollback via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            
            BASE_DIR=/home/ec2-user/deployments
            CURRENT_LINK=/home/ec2-user/Mantram
            
            # Get the second most recent directory (current is most recent)
            PREVIOUS_RELEASE=$(ls -1t $BASE_DIR | sed -n '2p')
            
            if [ -z "$PREVIOUS_RELEASE" ]; then
              echo "❌ No previous release found to rollback to!"
              exit 1
            fi
            
            echo "🔙 Rolling back to: $PREVIOUS_RELEASE"
            
            # Switch symlink
            ln -sfn $BASE_DIR/$PREVIOUS_RELEASE $CURRENT_LINK
            
            # Restart PM2
            cd $CURRENT_LINK
            pm2 startOrReload deploy/ecosystem.config.cjs --update-env
            pm2 save
            
            echo "✅ Rollback successful. Now running: $PREVIOUS_RELEASE"
            curl -sf http://localhost:3001/api/health || echo "⚠️ Warning: Health check missed, check manually."
