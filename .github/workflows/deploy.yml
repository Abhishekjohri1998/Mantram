name: 🚀 Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════
  # 🎨 Job 1: Build & Deploy Frontend (S3)
  # ═══════════════════════════════════════════
  deploy-frontend:
    name: 🎨 Frontend (S3 + CloudFront)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: https://api.mantram.ai/api

      - name: 📦 Sync to S3
        run: |
          echo "📁 Dist folder content:"
          ls -R frontend/dist
          aws s3 sync frontend/dist s3://${{ secrets.S3_BUCKET_NAME }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      - name: ⚡ Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

  # ═══════════════════════════════════════════
  # ⚙️ Job 2: Deploy Backend (EC2)
  # ═══════════════════════════════════════════
  deploy-backend:
    name: ⚙️ Backend (EC2 + PM2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            
            # Paths
            BASE_DIR=$HOME/deployments
            CURRENT_LINK=$HOME/Mantram
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            RELEASE_DIR=$BASE_DIR/$TIMESTAMP
            
            echo "📦 Creating release: $TIMESTAMP"
            mkdir -p $BASE_DIR
            rm -rf $RELEASE_DIR  # Ensure clean state
            # 1. Clone/Copy release
            git clone --depth=1 -b main https://github.com/Abhishekjohri1998/Mantram.git $RELEASE_DIR
            
            mkdir -p $RELEASE_DIR/backend/logs
            
            # 2. Restore .env (Crucial Step)
            echo "🔐 Restoring .env file..."
            if [ -f "$CURRENT_LINK/backend/.env" ]; then
              cp "$CURRENT_LINK/backend/.env" "$RELEASE_DIR/backend/.env"
            elif [ -d "${CURRENT_LINK}_old_folder" ] && [ -f "${CURRENT_LINK}_old_folder/backend/.env" ]; then
              cp "${CURRENT_LINK}_old_folder/backend/.env" "$RELEASE_DIR/backend/.env"
            elif [ -f ~/Mantram/backend/.env ]; then
              cp ~/Mantram/backend/.env "$RELEASE_DIR/backend/.env"
            else
              echo "❌ CRITICAL: .env file not found anywhere! Deployment will fail."
              exit 1
            fi

            # 2.5 Ensure CloudFront origin is in FRONTEND_URL
            echo "🌐 Ensuring CloudFront origin is in CORS allowlist..."
            CLOUDFRONT_ORIGIN="https://djty1w4l0681b.cloudfront.net"
            if grep -q "FRONTEND_URL" "$RELEASE_DIR/backend/.env"; then
              # If missing, append it
              if ! grep -q "$CLOUDFRONT_ORIGIN" "$RELEASE_DIR/backend/.env"; then
                sed -i "s|FRONTEND_URL=|FRONTEND_URL=$CLOUDFRONT_ORIGIN,|" "$RELEASE_DIR/backend/.env"
                echo "✅ Added $CLOUDFRONT_ORIGIN to FRONTEND_URL"
              fi
            else
              echo "FRONTEND_URL=$CLOUDFRONT_ORIGIN,https://mantram.ai" >> "$RELEASE_DIR/backend/.env"
              echo "✅ Created FRONTEND_URL in .env"
            fi

            # 2.5 Inject Razorpay Secrets
            if ! grep -q "RAZORPAY_KEY_ID" "$RELEASE_DIR/backend/.env"; then
              echo "RAZORPAY_KEY_ID=rzp_live_SNWgwltU4JKol6" >> "$RELEASE_DIR/backend/.env"
            fi
            if ! grep -q "RAZORPAY_KEY_SECRET" "$RELEASE_DIR/backend/.env"; then
              echo "RAZORPAY_KEY_SECRET=NBZfyya8Elg7b16ak9ADXr2O" >> "$RELEASE_DIR/backend/.env"
            fi

            echo "🌐 Verifying Allowed Origins (CORS):"
            grep "FRONTEND_URL" "$RELEASE_DIR/backend/.env" || echo "FRONTEND_URL not set in .env"
            
            # 3. Install & Build
            cd $RELEASE_DIR/backend
            npm ci --omit=dev
            
            # 3.5 Seed Superadmin accounts and subscription packages
            echo "🔑 Seeding data..."
            node scripts/seedSuperAdmin.js || echo "⚠️ Superadmin seeding failed or skipped"
            node scripts/seedPackages.js || echo "⚠️ Package seeding failed or skipped"
            
            # 4. Atomic Symlink Switch
            echo "🔗 Switching symlink..."
            if [ ! -L "$CURRENT_LINK" ] && [ -d "$CURRENT_LINK" ]; then
              echo "⚠️  Moving existing Mantram folder to Mantram_old_folder"
              mv "$CURRENT_LINK" "${CURRENT_LINK}_old_folder"
            fi
            ln -sfn $RELEASE_DIR $CURRENT_LINK
            
            # 5. Restart with PM2 (Force restart to pick up latest symlink)
            echo "🔄 Restarting backend..."
            cd $CURRENT_LINK
            
            echo "📄 Verifying index.js version (checking for 'cors' in health check):"
            grep "cors:" backend/index.js || echo "⚠️  WARNING: Latest code with 'cors' debug key not found in index.js!"
            
            pm2 delete mantram-server || true
            pm2 start deploy/ecosystem.config.cjs --update-env
            pm2 save
            
            # 6. Health Check (with Retry Loop)
            echo "🏥 Health check..."
            success=false
            for i in {1..6}; do
              echo "Attempt $i: Checking http://localhost:3001/api/health"
              if curl -sf http://localhost:3001/api/health; then
                echo "✅ Backend is UP"
                success=true
                break
              fi
              echo "⏳ Waiting for server to start... (5s)"
              sleep 5
            done
            
            if [ "$success" = false ]; then
              echo "❌ Backend health check failed! Showing PM2 Logs:"
              pm2 logs mantram-server --lines 100 --no-daemon --raw & sleep 10 && kill $!
              
              echo "🔍 Checking port 3001 usage..."
              sudo lsof -i :3001 || echo "Port 3001 is free"
              exit 1
            fi
            
            # 7. Cleanup old releases (keep last 5)
            cd $BASE_DIR
            ls -1t | tail -n +6 | xargs rm -rf || true
            echo "🧹 Old releases cleaned up"
