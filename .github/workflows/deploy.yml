name: 🚀 Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════
  # 🎨 Job 1: Build & Deploy Frontend (S3)
  # ═══════════════════════════════════════════
  deploy-frontend:
    name: 🎨 Frontend (S3 + CloudFront)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: https://api.mantram.ai/api

      - name: 📦 Sync to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --delete
        env:
          AWS_S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SOURCE_DIR: 'frontend/dist'

      - name: ⚡ Invalidate CloudFront
        uses: chetan/cloudfront-invalidation-action@master
        with:
          distribution: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          paths: '/*'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

  # ═══════════════════════════════════════════
  # ⚙️ Job 2: Deploy Backend (EC2)
  # ═══════════════════════════════════════════
  deploy-backend:
    name: ⚙️ Backend (EC2 + PM2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            
            # Paths
            BASE_DIR=/home/ec2-user/deployments
            CURRENT_LINK=/home/ec2-user/Mantram
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            RELEASE_DIR=$BASE_DIR/$TIMESTAMP
            
            echo "📦 Creating release: $TIMESTAMP"
            mkdir -p $BASE_DIR
            
            # 1. Clone/Copy release
            git clone --depth=1 -b main https://github.com/Abhishekjohri1998/Mantram.git $RELEASE_DIR
            
            # 2. Restore .env (from current folder or shared backup)
            if [ -L "$CURRENT_LINK" ]; then
              cp $CURRENT_LINK/backend/.env $RELEASE_DIR/backend/.env
            else
              # Fallback to shared location if symlink doesn't exist yet
              cp ~/Mantram_backup_*/.env $RELEASE_DIR/backend/.env || echo ".env restore failed"
            fi
            
            # 3. Install & Build
            cd $RELEASE_DIR/backend
            npm ci --omit=dev
            
            # 4. Atomic Symlink Switch
            echo "🔗 Switching symlink..."
            ln -sfn $RELEASE_DIR $CURRENT_LINK
            
            # 5. Restart with PM2
            cd $CURRENT_LINK
            pm2 startOrReload deploy/ecosystem.config.cjs --update-env
            pm2 save
            
            # 6. Health Check
            echo "🏥 Health check..."
            sleep 5
            if curl -sf http://localhost:3001/api/health > /dev/null; then
              echo "✅ Backend is UP"
            else
              echo "❌ Backend health check failed! Rolling back..."
              # Simple rollback: point symlink back to previous (if exists)
              # Ideally, Job 3 handles this more robustly, but this is a local safety
              exit 1
            fi
            
            # 7. Cleanup old releases (keep last 5)
            cd $BASE_DIR
            ls -1t | tail -n +6 | xargs rm -rf || true
            echo "🧹 Old releases cleaned up"
