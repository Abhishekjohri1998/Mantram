name: 🚀 Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════
  # 🎨 Job 1: Build & Deploy Frontend (S3)
  # ═══════════════════════════════════════════
  deploy-frontend:
    name: 🎨 Frontend (S3 + CloudFront)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: https://api.mantram.ai/api

      - name: 📦 Sync to S3
        run: |
          echo "📁 Dist folder content:"
          ls -R frontend/dist
          aws s3 sync frontend/dist s3://${{ secrets.FRONTEND_S3_BUCKET }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FRONTEND_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FRONTEND_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      - name: ⚡ Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FRONTEND_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FRONTEND_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

  # ═══════════════════════════════════════════
  # 🚀 Job 2: Deploy Backend (EC2)
  # ═══════════════════════════════════════════
  deploy-backend:
    name: 🚀 Backend (EC2)
    runs-on: ubuntu-latest
    needs: deploy-frontend
    steps:
      - name: ⚙️ Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.MEDIA_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MEDIA_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 🔍 Get Runner IP
        id: ip
        run: echo "ipv4=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT

      - name: 🔓 Whitelist Runner IP (Port 22)
        run: |
          RUNNER_IP="${{ steps.ip.outputs.ipv4 }}"
          SG_ID="${{ secrets.AWS_SECURITY_GROUP_ID }}"

          if [ -z "$SG_ID" ]; then
            echo "❌ ERROR: AWS_SECURITY_GROUP_ID secret is missing!"
            exit 1
          fi

          if [ -z "$RUNNER_IP" ]; then
            echo "❌ ERROR: Could not determine Runner IP!"
            exit 1
          fi

          echo "🌐 Runner IP: $RUNNER_IP"
          echo "🛡️ SG ID: $SG_ID"

          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP/32" || echo "✅ Rule may already exist, continuing..."

          echo "⏳ Waiting 10s for SG rule to propagate..."
          sleep 10

          echo "🔍 Verifying SSH connectivity..."
          for i in {1..5}; do
            if nc -zv ${{ secrets.EC2_HOST }} 22 -w 5 2>/dev/null; then
              echo "✅ Port 22 is reachable"
              break
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MEDIA_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MEDIA_AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.MEDIA_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          PIAPI_API_KEY: ${{ secrets.PIAPI_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 3600s
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_S3_BUCKET,AWS_REGION,RAZORPAY_KEY_ID,RAZORPAY_KEY_SECRET,PIAPI_API_KEY
          script: |
            set -e

            BASE_DIR=$HOME/deployments
            CURRENT_LINK=$HOME/Mantram
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            RELEASE_DIR=$BASE_DIR/$TIMESTAMP

            echo "📦 Creating release: $TIMESTAMP"
            mkdir -p $BASE_DIR
            rm -rf $RELEASE_DIR

            # 1. Clone release
            git clone --depth=1 -b main https://github.com/Abhishekjohri1998/Mantram.git $RELEASE_DIR
            mkdir -p $RELEASE_DIR/backend/logs

            # 2. Restore .env
            echo "🔐 Restoring .env file..."
            if [ -f "$CURRENT_LINK/backend/.env" ]; then
              cp "$CURRENT_LINK/backend/.env" "$RELEASE_DIR/backend/.env"
            elif [ -f "${CURRENT_LINK}_old_folder/backend/.env" ]; then
              cp "${CURRENT_LINK}_old_folder/backend/.env" "$RELEASE_DIR/backend/.env"
            else
              echo "❌ CRITICAL: .env file not found! Deployment will fail."
              exit 1
            fi

            # Function to safely update or append .env vars
            update_env_var() {
              local key=$1
              local value=$2
              if grep -q "^$key=" "$RELEASE_DIR/backend/.env"; then
                sed -i "s|^$key=.*|$key=$value|" "$RELEASE_DIR/backend/.env"
              else
                echo "$key=$value" >> "$RELEASE_DIR/backend/.env"
              fi
            }

            # 2.1 Ensure CloudFront origin is in FRONTEND_URL
            echo "🌐 Ensuring CloudFront origin is in CORS allowlist..."
            CLOUDFRONT_ORIGIN="https://djty1w4l0681b.cloudfront.net"
            if grep -q "FRONTEND_URL" "$RELEASE_DIR/backend/.env"; then
              if ! grep -q "$CLOUDFRONT_ORIGIN" "$RELEASE_DIR/backend/.env"; then
                sed -i "s|FRONTEND_URL=|FRONTEND_URL=$CLOUDFRONT_ORIGIN,|" "$RELEASE_DIR/backend/.env"
                echo "✅ Added $CLOUDFRONT_ORIGIN to FRONTEND_URL"
              fi
            else
              echo "FRONTEND_URL=$CLOUDFRONT_ORIGIN,https://mantram.ai,https://www.mantram.ai" >> "$RELEASE_DIR/backend/.env"
              echo "✅ Created FRONTEND_URL in .env"
            fi

            # 2.2 Inject AWS S3 Credentials
            echo "☁️ Updating AWS S3 configuration..."
            update_env_var "AWS_ACCESS_KEY_ID" "$AWS_ACCESS_KEY_ID"
            update_env_var "AWS_SECRET_ACCESS_KEY" "$AWS_SECRET_ACCESS_KEY"
            update_env_var "AWS_S3_BUCKET" "$AWS_S3_BUCKET"
            update_env_var "AWS_REGION" "$AWS_REGION"
            echo "✅ AWS S3 configuration updated"

            # 2.3 Inject Razorpay Secrets
            if [ ! -z "$RAZORPAY_KEY_ID" ]; then
              update_env_var "RAZORPAY_KEY_ID" "$RAZORPAY_KEY_ID"
            fi
            if [ ! -z "$RAZORPAY_KEY_SECRET" ]; then
              update_env_var "RAZORPAY_KEY_SECRET" "$RAZORPAY_KEY_SECRET"
            fi

            # 2.4 Inject PiAPI Secrets
            if [ ! -z "$PIAPI_API_KEY" ]; then
              update_env_var "PIAPI_API_KEY" "$PIAPI_API_KEY"
            fi

            echo "🌐 Verifying Allowed Origins (CORS):"
            grep "FRONTEND_URL" "$RELEASE_DIR/backend/.env" || echo "FRONTEND_URL not set in .env"

            # 3. Install dependencies
            echo "📦 Installing backend dependencies..."
            cd $RELEASE_DIR/backend
            PUPPETEER_SKIP_DOWNLOAD=true npm ci --omit=dev --no-audit --no-fund --loglevel=error

            # 3.5 Cleanup & Seed
            echo "🧹 Reclaiming database space..."
            node scripts/cleanupDatabase.js

            echo "🔑 Seeding data..."
            node scripts/seedSuperAdmin.js
            node scripts/seedPackages.js

            # 4. Atomic Symlink Switch
            echo "🔗 Switching symlink..."
            if [ ! -L "$CURRENT_LINK" ] && [ -d "$CURRENT_LINK" ]; then
              echo "⚠️ Moving existing Mantram folder to Mantram_old_folder"
              mv "$CURRENT_LINK" "${CURRENT_LINK}_old_folder"
            fi
            ln -sfn $RELEASE_DIR $CURRENT_LINK

            # 5. Restart PM2
            echo "🔄 Restarting backend..."
            cd $CURRENT_LINK
            pm2 delete mantram-server || true
            NODE_OPTIONS="--max-old-space-size=2048" pm2 start backend/deploy/ecosystem.config.cjs --update-env
            pm2 save

            # 6. Health Check
            echo "🏥 Health check..."
            success=false
            for i in {1..120}; do
              echo "Attempt $i: Checking http://localhost:3001/api/health"
              if curl -sf http://localhost:3001/api/health; then
                echo "✅ Backend is UP"
                success=true
                break
              fi
              echo "⏳ Waiting 5s..."
              sleep 5
            done

            if [ "$success" = false ]; then
              echo "❌ Backend health check failed! Showing PM2 Logs:"
              pm2 logs mantram-server --lines 100 --no-daemon --raw & sleep 10 && kill $!
              exit 1
            fi

            # 7. Cleanup old releases (keep last 5)
            cd $BASE_DIR
            ls -1t | tail -n +6 | xargs rm -rf || true
            echo "🧹 Old releases cleaned up"

      - name: 🔒 Revoke Runner IP (Cleanup)
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32 || echo "Rule already removed or not found"
