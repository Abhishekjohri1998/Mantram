# Mantram AI — Nginx Config
# Copy to /etc/nginx/sites-available/mantram on EC2
# Then: sudo ln -sf /etc/nginx/sites-available/mantram /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl restart nginx

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 80;
    server_name mantram.ai www.mantram.ai api.mantram.ai;
    # After SSL setup, Certbot will auto-add redirect to 443

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Brotli compression (install: sudo apt install brotli libnginx-mod-brotli)
    # Falls back to gzip if brotli module is not loaded
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/wasm;

    # Gzip compression (fallback for clients that don't support Brotli)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Frontend — Vite build (SPA)
    location / {
        root /var/www/mantram/current/dist;
        try_files $uri $uri/ /index.html;

        # index.html — never cache (ensures deploys are picked up instantly)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Cache static assets aggressively (hashed filenames = safe to cache forever)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Vary "Accept-Encoding";
        }
    }

    # API proxy → Node.js backend
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        # Let the Node backend handle CORS via our "Brute Force" middleware
        # Only add minimal proxy headers here
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts increased to 1000 minutes (60000s) for long-running AI operations
        # (SEO health checks, multi-model AI chains, image generation, crawls)
        proxy_read_timeout 60000s;
        proxy_send_timeout 60000s;
        proxy_connect_timeout 60s;

        # Custom JSON error pages for gateway errors
        error_page 502 = @bad_gateway_json;
        error_page 504 = @timeout_json;

        # Large body for image uploads
        client_max_body_size 50m;
    }

    # Named location for 502 Bad Gateway JSON response with CORS headers
    location @bad_gateway_json {
        default_type application/json;
        add_header 'Access-Control-Allow-Origin' 'https://mantram.ai' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        return 502 '{"success":false,"error":"Server Restarting","message":"The server is restarting after a deployment. Please try again in a few seconds."}';
    }

    # Named location for timeout JSON response with CORS headers
    location @timeout_json {
        default_type application/json;
        add_header 'Access-Control-Allow-Origin' 'https://mantram.ai' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        return 504 '{"success":false,"error":"Gateway Timeout","message":"The request took too long to process. The server is still working in the background, please try refreshing the page in a moment."}';
    }

    # Block sensitive files
    location ~ /\. {
        deny all;
    }
    location ~ \.env$ {
        deny all;
    }
}
